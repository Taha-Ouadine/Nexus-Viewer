name: Sync SPHEREx releases
on:
  schedule:
    - cron: "17 6 * * 1"   # every Monday 06:17 UTC (IRSA ingests new SPHEREx data weekly)
  workflow_dispatch:
    inputs:
      auto:
        description: "Activate newly discovered releases automatically"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python scripts/sync_releases.py ${{ inputs.auto && '--auto' || '' }}
